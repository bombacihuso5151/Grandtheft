name: Build APK
on:
  push:
  workflow_dispatch:
env:
  GODOT_VERSION: "4.3"
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Hazirlik
        run: |
          unzip -q sunsetbay.zip
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot sunsetbay/build/android
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          cd sunsetbay
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cat > ~/.config/godot/editor_settings-4.tres <<EOS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME:-/usr/lib/android-sdk}"
          export/android/java_sdk_path = "${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
          cat > export_presets.cfg <<'EOP'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          export_path="build/android/sunsetbay.apk"
          [preset.0.options]
          gradle_build/use_gradle_build=false
          architectures/arm64-v8a=true
          version/code=1
          version/name="1.0"
          package/unique_name="com.sunsetbay.game"
          package/name="Sunset Bay"
          package/signed=true
          EOP
      - name: APK build
        run: |
          cd sunsetbay
          godot --headless --import || true
          godot --headless --export-debug "Android" build/android/sunsetbay.apk
          ls -la build/android
      - uses: actions/upload-artifact@v4
        with:
          name: sunsetbay-apk
          path: sunsetbay/build/android/sunsetbay.apk
          
