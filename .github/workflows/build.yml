name: Build APK
on:
  push:
  workflow_dispatch:
env:
  GODOT_VERSION: "4.3"
jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Hazirlik
        run: |
          unzip -q sunsetbay.zip
          mkdir -v -p ~/.local/share/godot/export_templates ~/.config/godot sunsetbay/build/android
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd sunsetbay
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cat > ~/.config/godot/editor_settings-4.tres <<EOS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME:-/usr/lib/android-sdk}"
          export/android/java_sdk_path = "${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOS
          echo "--- SDK ---"
          ls ${ANDROID_HOME:-/usr/lib/android-sdk}/platforms ${ANDROID_HOME:-/usr/lib/android-sdk}/build-tools || true
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable | head -30
      - name: Export ayari yaz
        run: |
          cd sunsetbay
          cat > export_presets.cfg <<'EOP'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/android/sunsetbay.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/export_format=0
          gradle_build/min_sdk="24"
          gradle_build/target_sdk="33"
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          version/code=1
          version/name="1.0"
          package/unique_name="com.sunsetbay.game"
          package/name="Sunset Bay"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          package/show_in_android_tv=false
          package/show_in_app_library=true
          package/show_as_launcher_app=false
          launcher_icons/main_192x192=""
          launcher_icons/adaptive_foreground_432x432=""
          launcher_icons/adaptive_background_432x432=""
          graphics/opengl_debug=false
          xr_features/xr_mode=0
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          apk_expansion/SALT=""
          apk_expansion/public_key=""
          EOP
      - name: APK build
        run: |
          cd sunsetbay
          godot --headless --verbose --import || true
          godot --headless --verbose --export-debug "Android" build/android/sunsetbay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sunsetbay-apk
          path: sunsetbay/build/android/sunsetbay.apk
